<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="1740" viewBox="0 0 1840 1740" role="img" aria-labelledby="title desc">
  <title id="title">Diagram Database Website TRM</title>
  <desc id="desc">Entity relationship diagram for seven tables in the Website TRM database. Only rag_chunks.document_id has a foreign key, referencing rag_documents.id with cascade delete.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0 0L10 5L0 10z" fill="#61718b"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#10213d" flood-opacity=".08"/></filter>
  </defs>
  <style>
    text { font-family: Inter, 'Segoe UI', Arial, sans-serif; fill: #17243a; }
    .page { fill: #f4f7fb; }
    .title { font-size: 38px; font-weight: 750; letter-spacing: -.6px; }
    .subtitle { font-size: 18px; fill: #58677e; }
    .tag { font-size: 13px; font-weight: 700; letter-spacing: 1.2px; }
    .table { fill: #fff; stroke: #d8e1ed; stroke-width: 1.4; filter: url(#shadow); }
    .head { fill: #eaf1fb; }
    .head-rag { fill: #e8f5f2; }
    .name { font-size: 19px; font-weight: 700; }
    .meta { font-size: 12px; fill: #607089; }
    .field { font-size: 14px; font-weight: 600; }
    .type { font-size: 12px; fill: #53647b; }
    .badge { font-size: 10px; font-weight: 750; letter-spacing: .3px; }
    .line { stroke: #edf1f6; stroke-width: 1; }
    .noteTitle { font-size: 16px; font-weight: 700; }
    .note { font-size: 13px; fill: #53647b; }
    .rel { font-size: 12px; font-weight: 650; fill: #42536b; }
  </style>
