  <text x="64" y="116" class="title">Database Website TRM — Politeknik Dewantara</text>
  <text x="64" y="150" class="subtitle">ERD dari schema.sql dan migration RAG · 7 tabel · MySQL/MariaDB · seluruh kolom ditampilkan</text>
